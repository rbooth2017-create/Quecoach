<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262b38"/><stop offset="1" stop-color="#11141b"/>
    </linearGradient>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b9bff"/><stop offset="1" stop-color="#2f6fe0"/>
    </linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a66"/><stop offset="1" stop-color="#f05a3a"/>
    </linearGradient>
    <clipPath id="left"><rect x="0" y="0" width="512" height="1024"/></clipPath>
    <clipPath id="right"><rect x="512" y="0" width="512" height="1024"/></clipPath>
  </defs>
  <!-- rounded-square tile with the standard margin -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <!-- platter: deck A half and deck B half -->
  <circle cx="512" cy="512" r="300" fill="url(#a)" clip-path="url(#left)"/>
  <circle cx="512" cy="512" r="300" fill="url(#b)" clip-path="url(#right)"/>
  <!-- grooves -->
  <circle cx="512" cy="512" r="236" fill="none" stroke="#ffffff" stroke-opacity=".22" stroke-width="10"/>
  <circle cx="512" cy="512" r="172" fill="none" stroke="#ffffff" stroke-opacity=".16" stroke-width="10"/>
  <!-- label and spindle -->
  <circle cx="512" cy="512" r="96" fill="#11141b"/>
  <circle cx="512" cy="512" r="22" fill="#ffffff"/>
  <!-- the "1": a beat marker on the rim -->
  <circle cx="512" cy="248" r="30" fill="#ffffff"/>
</svg>
