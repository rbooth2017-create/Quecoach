<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cue Coach Library</title>
<style>
/* Themes: tokens only. "auto" follows the system (Fresh by day, Night after dark). */
:root {
  --bg: #f6f5f1; --card: #ffffff; --card-2: #f1efe9; --line: #e6e3db; --line-2: #d6d2c7;
  --ink: #1d2230; --ink-2: #5c6272; --ink-3: #9096a3;
  --left: #2f7df6; --left-soft: #e6f0ff; --right: #ff6b4a; --right-soft: #ffece7;
  --ok: #17a364; --ok-soft: #e3f6ec; --close: #c98a00; --close-soft: #fff4d6; --warn: #e0533d; --warn-soft: #fde9e5;
  --focus: 0 0 0 3px color-mix(in srgb, var(--left) 40%, transparent);
  --r: 18px; --r-sm: 12px;
  font-family: system-ui, -apple-system, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root[data-theme="auto"] { --bg: #14161b; --card: #1c1f26; --card-2: #23272f; --line: #2c313b; --line-2: #3a404c;
    --ink: #eef0f4; --ink-2: #a9afbc; --ink-3: #737a88;
    --left: #5b9bff; --left-soft: #1d2a42; --right: #ff8566; --right-soft: #3a2420;
    --ok: #3fd18b; --ok-soft: #173326; --close: #f2b631; --close-soft: #3a3016; --warn: #ff7a64; --warn-soft: #3b211d;
    color-scheme: dark; } }
:root[data-theme="night"] { --bg: #14161b; --card: #1c1f26; --card-2: #23272f; --line: #2c313b; --line-2: #3a404c;
    --ink: #eef0f4; --ink-2: #a9afbc; --ink-3: #737a88;
    --left: #5b9bff; --left-soft: #1d2a42; --right: #ff8566; --right-soft: #3a2420;
    --ok: #3fd18b; --ok-soft: #173326; --close: #f2b631; --close-soft: #3a3016; --warn: #ff7a64; --warn-soft: #3b211d;
    color-scheme: dark; }
:root[data-theme="neon"] {
  --bg: #0e0a1c; --card: #171129; --card-2: #211938; --line: #2c2249; --line-2: #3d3063;
  --ink: #f4f0ff; --ink-2: #b6abda; --ink-3: #7e72a6;
  --left: #22d3ee; --left-soft: #0f2c3a; --right: #f472b6; --right-soft: #3a1631;
  --ok: #4ade80; --ok-soft: #12321f; --close: #facc15; --close-soft: #352d0c; --warn: #fb7185; --warn-soft: #3a1520;
  color-scheme: dark;
}
:root[data-theme="sunset"] {
  --bg: #fcf1e4; --card: #fffaf3; --card-2: #f6e6d3; --line: #ecd8c0; --line-2: #dfc3a3;
  --ink: #3a2316; --ink-2: #77574a; --ink-3: #a98a78;
  --left: #0e9384; --left-soft: #dcf3ef; --right: #e8572f; --right-soft: #fde3d8;
  --ok: #2f8f4e; --ok-soft: #e1f2e4; --close: #b7791f; --close-soft: #fbecd2; --warn: #c2412d; --warn-soft: #f9ddd6;
  color-scheme: light;
}
:root[data-theme="studio"] {
  --bg: #0c0d0e; --card: #161718; --card-2: #1f2022; --line: #27292c; --line-2: #383b3f;
  --ink: #f2f2f2; --ink-2: #a3a6aa; --ink-3: #6c7075;
  --left: #2aa6ff; --left-soft: #0f2333; --right: #ffb020; --right-soft: #33260b;
  --ok: #3ddc84; --ok-soft: #10301f; --close: #ffd23f; --close-soft: #332b0d; --warn: #ff5a4e; --warn-soft: #351614;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-size: 13px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
body { display: grid; grid-template-rows: 46px minmax(0, 1fr); overflow: hidden; user-select: none; -webkit-user-select: none; cursor: default; }
button, input, select, textarea { font: inherit; color: inherit; }
input, textarea { user-select: text; -webkit-user-select: text; }
button { cursor: default; border: 1px solid var(--line-2); background: var(--card); border-radius: 8px; padding: 4px 10px; display: inline-flex; align-items: center; gap: 6px; transition: background .12s, border-color .12s; white-space: nowrap; }
button:hover { background: var(--card-2); }
button:active { transform: translateY(1px); }
button:disabled { opacity: .45; pointer-events: none; }
button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: none; box-shadow: var(--focus); }
button.primary { background: var(--ink); color: var(--card); border-color: var(--ink); }
button.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
button.ghost:hover { background: var(--card-2); color: var(--ink); }
button.on { background: var(--left-soft); border-color: var(--left); color: var(--left); }
button.small { padding: 3px 8px; font-size: 12px; }
input[type=text], input[type=search], input[type=number], select, textarea { border: 1px solid var(--line-2); background: var(--card); border-radius: 8px; padding: 4px 8px; min-width: 0; }
input[type=number] { width: 76px; }
.hidden { display: none !important; }
.muted { color: var(--ink-2); }
.small { font-size: 12px; }
.grow { flex: 1; }
kbd { font: 600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; padding: 1px 5px; border-radius: 5px; border: 1px solid var(--line-2); border-bottom-width: 2px; background: var(--card); color: var(--ink-2); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-track { background: transparent; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- title bar ---------- */
.titlebar { display: flex; align-items: center; gap: 10px; padding: 0 12px; border-bottom: 1px solid var(--line); background: var(--card); -webkit-app-region: drag; }
html.darwin .titlebar { padding-left: 84px; }
html.win32 .titlebar, html.linux .titlebar { padding-right: 146px; }
.titlebar button, .titlebar input, .titlebar select, .titlebar label { -webkit-app-region: no-drag; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 650; font-size: 14px; letter-spacing: -.01em; }
.logo { width: 20px; height: 20px; border-radius: 50%; background: radial-gradient(circle, #fff 0 10%, #11141b 11% 32%, transparent 33%), linear-gradient(90deg, var(--left) 50%, var(--right) 50%); }
.search { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); background: var(--bg); border-radius: 9px; padding: 0 8px; height: 30px; width: min(360px, 32vw); color: var(--ink-3); }
.search input { border: none; background: transparent; padding: 0; flex: 1; outline: none; box-shadow: none !important; color: var(--ink); }
.status { font-size: 12px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.spin { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line-2); border-top-color: var(--left); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- layout ---------- */
.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 0; }
.main { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-height: 0; min-width: 0; }
.app.no-editor .main { grid-template-rows: auto minmax(0, 1fr); }
.app.no-editor .editor { display: none; }

/* ---------- sidebar ---------- */
.side { border-right: 1px solid var(--line); background: var(--card); overflow: auto; padding: 10px 8px 16px; display: flex; flex-direction: column; gap: 2px; }
.side select { width: 100%; margin-bottom: 8px; }
.side-title { font-size: 11px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); padding: 12px 8px 4px; display: flex; align-items: center; }
.side-title button { padding: 0 4px; height: 20px; }
.node { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 8px; color: var(--ink-2); border: 1px solid transparent; min-width: 0; }
.node:hover { background: var(--card-2); color: var(--ink); }
.node.on { background: var(--left-soft); color: var(--ink); font-weight: 600; }
.node.on svg { color: var(--left); }
.node .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.node .count { font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.node.drop { border-color: var(--left); background: var(--left-soft); }
.node input { flex: 1; padding: 1px 6px; }
.node.now .name::after { content: 'in Cue Coach'; margin-left: 6px; font-size: 10px; font-weight: 600; color: var(--ok); background: var(--ok-soft); padding: 1px 6px; border-radius: 8px; }
.node.add { color: var(--ink-3); }
.side-note { font-size: 12px; color: var(--ink-3); padding: 4px 8px; }
.reconnect { margin: 6px 8px; }

/* ---------- list header ---------- */
.list-head { padding: 12px 16px 8px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; background: var(--bg); }
.lh-top { display: flex; align-items: center; gap: 10px; min-width: 0; }
.lh-top h1 { font-size: 18px; margin: 0; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lh-top h1 input { font-size: 17px; font-weight: 650; }
.lh-stats { font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.lh-stats b { color: var(--ink); font-weight: 600; }
.lh-filters { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); }
.lh-filters input[type=number] { width: 58px; padding: 2px 6px; }
.set-chart { display: grid; grid-template-columns: minmax(0, 1fr) 220px; gap: 16px; align-items: center; }
.set-chart .echart { max-height: 92px; }
.set-note { font-size: 12px; color: var(--ink-2); line-height: 1.5; }
.echart { display: block; width: 100%; height: auto; overflow: visible; color: var(--ink-2); }
.ec-axis { font-size: 9px; fill: var(--ink-3); letter-spacing: .05em; text-transform: uppercase; }
.ec-target { fill: none; stroke: var(--ink-3); stroke-width: 6; stroke-linecap: round; opacity: .18; }
.ec-line { fill: none; stroke: var(--left); stroke-width: 2; stroke-linejoin: round; }
.ec-dot circle { fill: var(--left); stroke: var(--card); stroke-width: 1.5; }
.ec-dot.unknown circle { fill: var(--card); stroke: var(--ink-3); stroke-dasharray: 2 2; }
.ec-dot.warn circle { stroke: var(--warn); stroke-width: 2.5; }
.ec-dot.hl circle { stroke: var(--ink); stroke-width: 2.5; }
.ec-warn { font-size: 10px; font-weight: 700; fill: var(--warn); }
.ec-label { font-size: 9px; fill: var(--ink-3); }

/* ---------- track table ---------- */
.table-wrap { overflow: auto; min-height: 0; background: var(--card); }
table { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; }
thead th { position: sticky; top: 0; z-index: 2; background: var(--card); border-bottom: 1px solid var(--line); text-align: left; font-size: 11px; font-weight: 600; color: var(--ink-3); padding: 6px 8px; white-space: nowrap; overflow: hidden; }
thead th[data-sort]:hover { color: var(--ink); }
thead th.sorted { color: var(--ink); }
thead th.sorted::after { content: ' ▲'; font-size: 8px; }
thead th.sorted.desc::after { content: ' ▼'; }
tbody td { padding: 0 8px; height: 30px; border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12.5px; }
tbody tr:hover td { background: var(--card-2); }
tbody tr.sel td { background: var(--left-soft); }
tbody tr.focus td:first-child { box-shadow: inset 3px 0 0 var(--left); }
tbody tr.dragging { opacity: .4; }
tbody tr.drop-before td { box-shadow: inset 0 2px 0 var(--left); }
tbody tr.drop-after td { box-shadow: inset 0 -2px 0 var(--left); }
td.t-title b { font-weight: 600; }
td.dim, .dim { color: var(--ink-3); }
.c-n { width: 38px; text-align: right; color: var(--ink-3); }
.c-title { width: auto; } .c-artist { width: 18%; } .c-bpm { width: 64px; } .c-key { width: 52px; } .c-energy { width: 62px; }
.c-time { width: 52px; } .c-genre { width: 12%; } .c-cues { width: 50px; } .c-grid { width: 52px; } .c-added { width: 88px; } .c-next { width: 168px; } .c-act { width: 82px; }
.keyb { display: inline-block; min-width: 30px; text-align: center; font-weight: 650; font-size: 11px; padding: 1px 5px; border-radius: 6px; color: #fff; }
.keyb.none { background: var(--card-2); color: var(--ink-3); }
.ebar { display: inline-flex; align-items: center; gap: 5px; }
.ebar i { display: inline-block; height: 5px; border-radius: 3px; background: var(--right); }
.ebar.est i { background: var(--ink-3); }
.gdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
.gdot.adjusted { background: var(--ok); } .gdot.ok { background: var(--left); } .gdot.unsure { background: var(--close); }
.gdot.approx, .gdot.none { background: transparent; border: 1.5px solid var(--ink-3); }
.cdots { display: inline-flex; gap: 2px; }
.cdots i { width: 6px; height: 6px; border-radius: 2px; }
.row-act { display: inline-flex; gap: 2px; opacity: 0; }
tr:hover .row-act, tr.focus .row-act { opacity: 1; }
.row-act button { padding: 1px 6px; font-size: 11px; font-weight: 650; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; padding: 1px 7px; border-radius: 10px; }
.chip.great { background: var(--ok-soft); color: var(--ok); }
.chip.good { background: var(--close-soft); color: var(--close); }
.chip.tricky { background: var(--warn-soft); color: var(--warn); }
.chip .arrow { font-weight: 700; }
.empty { display: grid; place-items: center; text-align: center; gap: 6px; padding: 60px 20px; color: var(--ink-2); }
.empty b { color: var(--ink); font-size: 15px; }
.empty svg { color: var(--ink-3); }

/* ---------- editor ---------- */
.editor { border-top: 1px solid var(--line); background: var(--card); display: grid; grid-template-rows: auto auto auto auto; min-height: 0; }
.ed-head { display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-bottom: 1px solid var(--line); min-width: 0; }
.ed-title { min-width: 0; display: grid; }
.ed-title b { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ed-title span { font-size: 12px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ed-facts { display: flex; gap: 14px; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.ed-facts b { color: var(--ink); font-variant-numeric: tabular-nums; }
.tabs { display: inline-flex; background: var(--card-2); border-radius: 9px; padding: 2px; gap: 2px; }
.tabs button { border: none; background: transparent; padding: 3px 10px; font-size: 12px; color: var(--ink-2); border-radius: 7px; }
.tabs button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.waves { position: relative; padding: 8px 14px 0; display: grid; gap: 6px; }
.waves canvas { display: block; width: 100%; border-radius: 8px; background: var(--card-2); }
#overview { height: 46px; cursor: pointer; }
#zoom { height: 128px; cursor: grab; }
#zoom.dragging { cursor: grabbing; }
#zoom.grid-drag { cursor: ew-resize; }
.wave-msg { position: absolute; inset: 8px 14px 0; display: grid; place-items: center; color: var(--ink-2); font-size: 12px; pointer-events: none; }
.ed-tools { display: grid; grid-template-columns: auto auto minmax(0, 1fr); gap: 0; padding: 8px 6px 10px; align-items: start; }
.group { padding: 2px 10px; display: grid; gap: 6px; border-right: 1px solid var(--line); }
.group:last-child { border-right: none; }
.group h3 { margin: 0; font-size: 11px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); display: flex; align-items: center; gap: 6px; }
.group h3 .gs { text-transform: none; letter-spacing: 0; font-weight: 600; font-size: 11px; display: inline-flex; align-items: center; gap: 4px; }
.row { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.row button { padding: 3px 8px; font-size: 12px; }
.row .lbl { font-size: 11px; color: var(--ink-3); margin: 0 2px 0 6px; }
.tc { font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; min-width: 72px; }
.play-btn { width: 38px; height: 32px; justify-content: center; padding: 0 !important; }
.cue-btn { font-weight: 700; color: var(--close) !important; }
.pads { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; }
.pad { position: relative; height: 40px; flex-direction: column; justify-content: center; gap: 0; padding: 2px 4px !important; border-radius: 8px; font-size: 12px; min-width: 0; }
.pad b { font-size: 12px; }
.pad small { font-size: 10px; color: var(--ink-3); max-width: 100%; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.pad.set { background: color-mix(in srgb, var(--hc) 18%, var(--card)); border-color: var(--hc); }
.pad.set b { color: var(--hc); }
.pad .x { position: absolute; top: 1px; right: 2px; border: none; background: transparent; padding: 0 3px !important; font-size: 11px; color: var(--ink-3); display: none; }
.pad.set:hover .x { display: block; }
.cue-list { max-height: 96px; overflow: auto; display: grid; gap: 2px; align-content: start; }
.cl-row { display: grid; grid-template-columns: 22px 72px minmax(0, 1fr) auto; gap: 6px; align-items: center; font-size: 12px; }
.cl-row .sw { width: 18px; height: 16px; border-radius: 4px; display: grid; place-items: center; font-size: 10px; font-weight: 700; color: #fff; }
.cl-row input { padding: 1px 6px; font-size: 12px; }
.cl-row .acts { display: inline-flex; gap: 2px; }
.cl-row .acts button { padding: 0 6px; font-size: 11px; border-color: transparent; background: transparent; color: var(--ink-2); }
.cl-row .acts button:hover { background: var(--card-2); }
.info { padding: 12px 14px 14px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px 14px; }
.info label { display: grid; gap: 3px; font-size: 11px; color: var(--ink-3); font-weight: 600; }
.info label.wide { grid-column: span 2; }
.info label.full { grid-column: 1 / -1; }
.info input, .info textarea { font-size: 13px; color: var(--ink); font-weight: 400; }
.info .note { grid-column: 1 / -1; font-size: 12px; color: var(--ink-2); }
.stars { display: inline-flex; gap: 2px; }
.stars button { border: none; background: transparent; padding: 0 1px; font-size: 16px; color: var(--line-2); }
.stars button.on { color: var(--close); }

/* ---------- menus, toast ---------- */
.menu { position: fixed; z-index: 50; min-width: 200px; max-width: 280px; background: var(--card); border: 1px solid var(--line-2); border-radius: 10px; box-shadow: 0 12px 32px rgba(0,0,0,.22); padding: 5px; display: grid; }
.menu button { border: none; background: transparent; justify-content: flex-start; padding: 6px 10px; border-radius: 6px; font-size: 13px; }
.menu button:hover { background: var(--left-soft); }
.menu hr { border: none; border-top: 1px solid var(--line); margin: 4px 2px; width: auto; }
.menu .mh { font-size: 11px; color: var(--ink-3); font-weight: 650; padding: 6px 10px 2px; text-transform: uppercase; letter-spacing: .05em; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--card); padding: 9px 16px; border-radius: 10px; font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,.25); z-index: 60; max-width: 560px; text-align: center; transition: opacity .2s; }
.toast.gone { opacity: 0; pointer-events: none; }
.drag-ghost { position: fixed; top: -100px; left: 0; padding: 4px 10px; border-radius: 8px; background: var(--ink); color: var(--card); font-size: 12px; font-weight: 600; }
</style>
</head>
<body>
<header class="titlebar">
  <div class="brand"><span class="logo"></span>Library</div>
  <label class="search"><span id="searchIcon"></span><input id="search" type="search" placeholder="Search title, artist, genre or key" autocomplete="off" spellcheck="false"></label>
  <div class="status" id="status"></div>
  <span class="grow"></span>
  <button class="ghost small" id="helpBtn" title="Keyboard shortcuts">Shortcuts</button>
</header>
<div class="app" id="app">
  <nav class="side" id="side" aria-label="Music, crates and set lists"></nav>
  <main class="main">
    <section class="list-head" id="listHead"></section>
    <div class="table-wrap" id="tableWrap" tabindex="0"><div id="table"></div></div>
    <section class="editor" id="editor" aria-label="Track editor"></section>
  </main>
</div>
<div class="toast gone" id="toast" role="status"></div>
<script type="module" src="js/manager.js"></script>
</body>
</html>
